title: Service Account Interactive Logon from Workstation
id: 7a1c2e55-0b6e-4d0e-9a62-1a2b3c4d5e04
status: experimental
description: Service accounts (svc-*) should never log on interactively (type 10) or from workstations (T1021.001).
author: IR Simulation Project
date: 2026/03/10
tags: [attack.lateral_movement, attack.t1021.001]
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    TargetUserName|startswith: 'svc-'
    LogonType: [10, 3]
  filter_server:
    WorkstationName|startswith: ['BK-', 'FS-', 'DC-']
  condition: selection and not filter_server
level: high

title: Encoded PowerShell Launched by Office Application
id: 7a1c2e55-0b6e-4d0e-9a62-1a2b3c4d5e02
status: stable
description: Office app spawning PowerShell with an encoded command (T1059.001).
author: IR Simulation Project
date: 2026/03/10
tags: [attack.execution, attack.t1059.001]
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: ['\winword.exe', '\excel.exe', '\outlook.exe']
  selection_child:
    Image|endswith: '\powershell.exe'
    CommandLine|contains: [' -enc', ' -EncodedCommand']
  condition: selection_parent and selection_child
falsepositives:
  - Legacy macro-based admin tools
level: high

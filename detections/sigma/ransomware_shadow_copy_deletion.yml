title: Volume Shadow Copy Deletion via vssadmin
id: 7a1c2e55-0b6e-4d0e-9a62-1a2b3c4d5e01
status: stable
description: Detects deletion of shadow copies, a common pre-encryption step of ransomware (T1490).
author: IR Simulation Project
date: 2026/03/10
tags: [attack.impact, attack.t1490]
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection
falsepositives:
  - Rare administrative clean-up (verify with change ticket)
level: critical
